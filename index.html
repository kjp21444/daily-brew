<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Layout: phone-first single column, scrolling screen above a fixed bottom tab bar; onboarding hides the bar. */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --ink: #1c2126;
  --muted: #5d6670;
  --line: #d6dbe0;
  --accent: #b5621b;
  --accent-ink: #ffffff;
  --accent-soft: #f6e6d6;
  --good: #2f7a4f;
  --warn: #9a6a00;
  --bad: #b23b3b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181b; --surface: #1f2428; --ink: #eef1f3; --muted: #9aa4ad; --line: #333a40;
    --accent: #e8954d; --accent-ink: #1a1208; --accent-soft: #3a2a1c;
    --good: #6cc191; --warn: #e0b54a; --bad: #ef7b7b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181b; --surface: #1f2428; --ink: #eef1f3; --muted: #9aa4ad; --line: #333a40;
  --accent: #e8954d; --accent-ink: #1a1208; --accent-soft: #3a2a1c;
  --good: #6cc191; --warn: #e0b54a; --bad: #ef7b7b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; }
.screen { padding: 20px 16px 110px; display: grid; gap: 16px; }
.screen.onboard { padding-bottom: 32px; min-height: 100%; align-content: start; }

h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-weight: 600; font-size: 20px; line-height: 1.2; }
h3 { font-weight: 600; font-size: 17px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
p { margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.hero { border: 2px solid var(--accent); }
.hero h2 { font-size: 26px; font-weight: 800; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.why { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.why li::before { content: "✓ "; color: var(--accent); font-weight: 600; }

.btn { font-weight: 600; font-size: 15px; border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; }
.btns .btn { flex: 1; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 14px; }

.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; width: 100%; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.item .t { font-weight: 600; }
.item .m { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

/* Survey */
.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.25s; }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; display: grid; gap: 2px; }
.opt .s { font-size: 13px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .t::after { content: " ✓"; color: var(--accent); }
.opt .t { font-weight: 600; }

/* Pantry */
.pantry-sec { display: grid; gap: 10px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.tog { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; }
.tog[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.tog[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); }

/* Recipe */
.back { justify-self: start; background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; cursor: pointer; }
.ings { list-style: none; margin: 0; padding: 0; display: grid; }
.ing { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line); }
.ing:first-child { border-top: 0; }
.ing .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
.ic.have { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.ic.sub { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.ic.missing { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.ic.opt { background: var(--bg); color: var(--muted); }
.ing .name { font-weight: 500; }
.ing .note { font-size: 13px; color: var(--muted); }
.ing .qty { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 600; cursor: pointer; }
.stepper output { min-width: 60px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 11px 12px; border-radius: 12px; background: var(--bg); cursor: pointer; }
.steps input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.steps input:checked + span { color: var(--muted); text-decoration: line-through; }

.search { width: 100%; padding: 12px 14px; font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters .tog { white-space: nowrap; font-size: 14px; padding: 6px 12px; }
.filters .tog[aria-pressed="true"]::before { content: ""; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 500; }

/* Nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 9px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 14, 0.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 82%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; }
.subopt { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); display: grid; gap: 4px; }
.subopt.ok { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.subopt .h { font-size: 13px; font-weight: 600; }
.subopt.ok .h { color: var(--good); }
.subopt.no .h { color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; color: var(--muted); }
.field-in { width: 100%; padding: 10px 12px; font: inherit; font-size: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
textarea.field-in { resize: vertical; line-height: 1.4; }
.ed-ing { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.ed-ing .field-in { background: var(--surface); }
.ed-row { display: grid; grid-template-columns: 4.5rem minmax(5.5rem, 1fr) auto auto; gap: 8px; align-items: center; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.chk input { accent-color: var(--accent); width: 18px; height: 18px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.cs-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.cs-row .tog { justify-self: start; }
.howto { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.addr { font-weight: 600; word-break: break-all; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.err { color: var(--bad); font-weight: 500; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.save-note { font-size: 12px; color: var(--muted); text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
</style>
</head>

<nav class="tabs" id="nav" hidden aria-label="Main">
  <div class="in">

</nav>

/* ---------- Logic ---------- */

}

  if (STAPLES[id]) return STAPLES[id];

    var pick = groupOrder(id).filter(function (x) { return profile.pantry[x]; })[0];

}

var LEVEL = { strength: ["", "Mild", "Balanced", "Bold"], milk: ["Black", "Splash of milk", "Milky"], sweet: ["Not sweet", "Lightly sweet", "Sweet"] };

/* ---------- Formatting ---------- */
function frac(n) {

function amt(q, u) {

    if (q < 180) return (Math.round(q / 29.57 * 2) / 2) + " fl oz";

  if (u === "tbsp") return frac(q) + " tbsp";

  if (u === "scoop") return q + " scoop" + (q > 1 ? "s" : "");
  if (u === "strip") return q + " strip" + (q > 1 ? "s" : "");

    if (method === "pod_brew") return "Your pod brewer can't make true espresso, so brew a pod on its smallest, strongest setting and use " + amt(ml * 1.5, "ml") + ".";
    if (method === "moka") return "Brew strong coffee in your moka pot and measure out " + A + ".";

function renderLibList() {

function saveDraft() {
  var d = ui.draft, name = d.name.trim(), lines = d.steps.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
  var ing = d.ing.filter(function (g) { return g.id && (g.id !== "x:" || g.text.trim()); }).map(function (g) {
    var q = parseFloat(g.q); if (!(q > 0)) q = 1;
    var u = g.u; if (u === "fl oz") { q = q * 29.57; u = "ml"; } else if (u === "cup") { q = q * 240; u = "ml"; }
    var row = [g.id === "x:" ? "x:" + g.text.trim().slice(0, 40) : g.id, q, u, !!g.opt];
    if (g.note) row.push(g.note);
    return row;
  });
  var hasBase = d.baseType !== "none";
  if (!name) return "Give your recipe a name.";
  if (!ing.length && !hasBase) return "Add a coffee base or at least one ingredient.";
  if (!lines.length) return "Add at least one step.";
  var ba = parseFloat(d.baseAmt); if (hasBase && !(ba > 0)) return "Enter how much coffee goes in each mug.";
  var r = { id: d.id || "m_" + Date.now().toString(36), mine: true, name: name.slice(0, 50), blurb: d.blurb.trim() || "One of my own recipes.", temp: d.temp,
    strength: +d.strength, milk: +d.milk, sweet: +d.sweet, flavors: d.flavors.slice(), base: hasBase ? [d.baseType, baseFromInput(d.baseType, ba)] : null, ing: ing, steps: lines };

  persist(); refreshR();
  ui.recipe = r.id; ui.from = "mine"; ui.mugs = 1; ui.view = "recipe"; ui.draft = null; ui.draftErr = "";
  return "";
}

/* ---------- Backup & restore ---------- */
function isArtifact() { return !!(window.claude && typeof window.claude.use === "function"); }
function pantryCount(p) { return Object.keys(p.pantry || {}).filter(function (k) { return p.pantry[k]; }).length; }
function backupObj() { return { app: "daily-brew", version: 1, exportedAt: new Date().toISOString(), profile: JSON.parse(JSON.stringify(profile)) }; }
function backupCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(backupObj())))); }
function parseBackup(text) {
  text = (text || "").trim(); if (!text) return null;
  var obj = null;
  try { obj = JSON.parse(text); } catch (e) {
    try { obj = JSON.parse(decodeURIComponent(escape(atob(text.replace(/\s+/g, ""))))); } catch (e2) { obj = null; }
  }
  if (obj && obj.profile && obj.profile.survey) return obj;
  if (obj && obj.survey) return { profile: obj, exportedAt: null };
  return null;
}
function whenText(t) {
  if (!t) return "not yet";
  return new Date(t).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function isStandalone() { try { return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } }
function phoneCard() {
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  var head = '<div class="card" id="phone"><h2>Add to your phone</h2>', body;
  var hosted = /^https?:$/.test(location.protocol) && !/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
  if (isStandalone()) body = '<p>You\'re using Daily Brew from your home screen. It works offline too.</p>';
  else if (isArtifact()) body = '<p class="small">Open this page\'s link on your phone, in the Claude app or your phone\'s browser, signed in to the same account. Your pantry and recipes come along automatically because they\'re saved to your Claude account.</p>' +
    '<p class="muted small">For a standalone app with its own home-screen icon, use the project folder on your computer and follow its README.</p>';
  else if (installPrompt) body = '<p class="small">Install Daily Brew as an app with its own icon. It opens full-screen and works offline.</p><button type="button" class="btn primary block" data-act="install">Install Daily Brew</button>';
  else if (ios) body = '<ol class="howto"><li>Open this page in <strong>Safari</strong>.</li><li>Tap the <strong>Share</strong> button (the square with an arrow).</li><li>Scroll down and tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li><li>Open Daily Brew from your home screen and restore your backup there. iPhone keeps home-screen apps separate from Safari.</li></ol>';
  else if (android) body = '<ol class="howto"><li>Open this page in <strong>Chrome</strong>.</li><li>Tap the <strong>⋮</strong> menu.</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li><li>Open Daily Brew from your home screen and restore your backup if you made one.</li></ol>';
  else if (hosted) body = '<p class="small">Open this address on your phone:</p><p class="addr">' + esc(location.origin + location.pathname) + '</p><p class="muted small">Then follow the steps this card shows on your phone. Tap <strong>Copy backup code</strong> above first, and send it to yourself so you can bring your pantry and recipes along.</p>';
  else body = '<p class="small">A phone can only install the app from a web address, so put it online first. It\'s free and takes a minute:</p>' +
    '<ol class="howto"><li>Tap <strong>Copy backup code</strong> above and send it to yourself (email or a note), so your pantry and recipes come along.</li>' +
    '<li>Go to <strong>app.netlify.com/drop</strong> on this computer and drag your <strong>daily-brew</strong> folder onto the page.</li>' +
    '<li>Open the link it gives you on your phone and add it to your home screen.</li>' +
    '<li>Open Daily Brew on your phone, choose <strong>I have a backup to restore</strong>, and paste the code.</li></ol>';
  return head + body + "</div>";
}
function saveNote() { return cloud.status === "cloud" ? "Saved to your Claude account" : "Saved on this device"; }

/* ---------- Sheet ---------- */
var sheetRoot = document.getElementById("sheet-root"), lastFocus = null;
function openSheet(title, intro, opts) {
  lastFocus = document.activeElement;
  var body = opts.map(function (o) {
    return '<div class="subopt ' + (o.ok ? "ok" : "no") + '"><span class="h">' + (o.ok ? "You have this" : "Needs " + o.missing.map(labelFor).join(", ").toLowerCase()) + "</span><span>" + o.how + "</span></div>";
  }).join("");
  sheetRoot.innerHTML = '<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab"></div>' +
    '<h2 id="sheet-title">' + title + "</h2>" + (intro ? '<p class="muted small">' + intro + "</p>" : "") + body +
    '<button class="btn block" data-act="close">Close</button></div></div>';
  var b = sheetRoot.querySelector(".sheet .btn"); if (b) b.focus();
}
function closeSheet() { sheetRoot.innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheetRoot.innerHTML) closeSheet(); });

/* ---------- Events ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act],[data-go]");
  if (!t) return;
  if (t.dataset.go) { ui.view = t.dataset.go; ui.offset = ui.view === "today" ? ui.offset : ui.offset; render(); return; }
  var a = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
  if (a === "close") { if (e.target === t || t.tagName === "BUTTON") closeSheet(); return; }
  if (a === "start") { ui.view = "survey"; ui.step = 0; render(); }
  else if (a === "answer") {
    var q = SURVEY[ui.step], val = isNaN(+v) ? v : +v;
    if (q.multi) {
      var arr = profile.survey[q.key], ix = arr.indexOf(val);
      if (ix >= 0) arr.splice(ix, 1); else arr.push(val);
    } else profile.survey[q.key] = val;
    persist();
    var keepY = window.scrollY; render(); window.scrollTo(0, keepY);
  }
  else if (a === "snext") {
    if (ui.step < SURVEY.length - 1) { ui.step++; render(); }
    else {
      if (!Object.keys(profile.pantry).length) {
        // sensible starting pantry based on answers
        if (profile.survey.milk > 0) profile.pantry[profile.survey.dairy === "plant" ? "milk_oat" : "milk_whole"] = true;
        if (profile.survey.sweet > 0) profile.pantry.sugar = true;
        profile.pantry.cinnamon = true;
        persist();
      }
      ui.view = "setup"; render();
    }
  }
  else if (a === "sback") { if (ui.step > 0) { ui.step--; } else { ui.view = profile.done ? "profile" : "welcome"; } render(); }
  else if (a === "equip") {
    var eqs = profile.survey.equipment, k = eqs.indexOf(id);
    if (k >= 0) eqs.splice(k, 1); else eqs.push(id);
    persist(); t.setAttribute("aria-pressed", k < 0);
  }
  else if (a === "pantry") {
    if (profile.pantry[id]) delete profile.pantry[id]; else profile.pantry[id] = true;
    persist(); t.setAttribute("aria-pressed", !!profile.pantry[id]);
    var note = app.querySelector(".save-note");
    if (note && ui.view === "pantry") note.textContent = Object.keys(profile.pantry).length + " items in your pantry · " + saveNote();
  }
  else if (a === "finish") { profile.done = true; persist(); ui.view = "today"; ui.offset = 0; render(); }
  else if (a === "another") { ui.offset++; render(); }
  else if (a === "newrec") { ui.editFrom = "mine"; ui.draft = blankDraft(); ui.draftErr = ""; ui.view = "edit"; render(); }
  else if (a === "editrec") { ui.editFrom = "recipe"; ui.draft = draftFrom(R[ui.recipe], true); ui.draftErr = ""; ui.view = "edit"; render(); }
  else if (a === "customize") { ui.editFrom = "recipe"; ui.draft = draftFrom(R[ui.recipe], false); ui.draftErr = ""; ui.view = "edit"; render(); }
  else if (a === "cancelrec") { ui.draft = null; ui.view = ui.editFrom === "recipe" && R[ui.recipe] ? "recipe" : "mine"; render(); }
  else if (a === "saverec") { var err = saveDraft(); if (err) { ui.draftErr = err; renderKeep(); } else render(); }
  else if (a === "df") { ui.draft[t.dataset.k] = isNaN(+v) ? v : +v; renderKeep(); }
  else if (a === "dflav") { var fl = ui.draft.flavors, fi = fl.indexOf(v); if (fi >= 0) fl.splice(fi, 1); else fl.push(v); t.setAttribute("aria-pressed", fi < 0); }
  else if (a === "ingadd") { ui.draft.ing.push({ id: "", text: "", q: "", u: "tsp", opt: false, note: "" }); renderKeep(); var sel = document.getElementById("ing-" + (ui.draft.ing.length - 1)); if (sel) sel.focus(); }
  else if (a === "ingdel") { ui.draft.ing.splice(+t.dataset.i, 1); renderKeep(); }
  else if (a === "delrec") { ui.confirmDel = true; renderKeep(); }
  else if (a === "delno") { ui.confirmDel = false; renderKeep(); }
  else if (a === "delyes") { profile.mine = (profile.mine || []).filter(function (x) { return x.id !== ui.recipe; }); ui.confirmDel = false; persist(); ui.view = "mine"; render(); }
  else if (a === "csadd") {
    var nm = (document.getElementById("cs-name").value || "").trim(), fv = document.getElementById("cs-flavor").value;
    if (!nm) { ui.csErr = "Type a name first."; renderKeep(); return; }
    if ((profile.custom || []).some(function (c) { return c.name.toLowerCase() === nm.toLowerCase(); })) { ui.csErr = "You already added that one."; renderKeep(); return; }
    var cid = "c_" + Date.now().toString(36);
    profile.custom = (profile.custom || []).concat([{ id: cid, name: nm.slice(0, 40), flavor: fv, kind: ui.csKind === "extract" ? "extract" : "syrup" }]);
    profile.pantry[cid] = true; ui.csErr = ""; persist(); renderKeep();
  }
  else if (a === "cskind") { var keepName = (document.getElementById("cs-name") || {}).value || ""; ui.csKind = v; renderKeep(); var ni = document.getElementById("cs-name"); if (ni) ni.value = keepName; }
  else if (a === "openrestore") { ui.pending = null; ui.restoreErr = ""; ui.restoreText = ""; ui.view = "restore"; render(); }
  else if (a === "restoreback") { ui.view = profile.done ? "profile" : "welcome"; render(); }
  else if (a === "dorestore") {
    if (!ui.pending) return;
    profile = Object.assign(blankProfile(), ui.pending.profile);
    if (profile.survey && profile.survey.equipment && profile.survey.equipment.length) profile.done = true;
    ui.pending = null; ui.restoreText = ""; persist();
    ui.backupMsg = "Restored. Your pantry and recipes are back.";
    ui.view = profile.done ? "today" : "survey"; ui.step = 0; ui.offset = 0; render();
  }
  else if (a === "backupcopy") {
    var code = backupCode();
    var done = function () { ui.backupMsg = "Backup code copied. Paste it somewhere safe, like a note or an email to yourself."; ui.showCode = false; renderKeep(); };
    var fail = function () { ui.backupMsg = "Copy the code below and keep it somewhere safe."; ui.showCode = true; renderKeep(); var ta = document.getElementById("bcode"); if (ta) { ta.focus(); ta.select(); } };
    try { navigator.clipboard.writeText(code).then(done, fail); } catch (err) { fail(); }
  }
  else if (a === "backupfile") {
    try {
      var blob = new Blob([JSON.stringify(backupObj(), null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob), link = document.createElement("a"), d8 = new Date();
      link.href = url; link.download = "daily-brew-backup-" + d8.getFullYear() + "-" + String(d8.getMonth() + 1).padStart(2, "0") + "-" + String(d8.getDate()).padStart(2, "0") + ".json";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      ui.backupMsg = "Backup file saved to your Downloads folder.";
    } catch (err) { ui.backupMsg = "Your browser blocked the download. Use Copy backup code instead."; }
    renderKeep();
  }
  else if (a === "install") {
    if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.then(function () { installPrompt = null; renderKeep(); }, function () {}); }
  }
  else if (a === "csdel") { profile.custom = (profile.custom || []).filter(function (c) { return c.id !== id; }); delete profile.pantry[id]; persist(); renderKeep(); }
  else if (a === "open") { ui.confirmDel = false; ui.from = ui.view === "recipe" ? ui.from : ui.view; ui.recipe = id; ui.mugs = 1; ui.view = "recipe"; render(); }
  else if (a === "method") { profile.lastMethod = profile.lastMethod || {}; profile.lastMethod[R[ui.recipe].base[0]] = v; persist(); var y3 = window.scrollY; render(); window.scrollTo(0, y3); }
  else if (a === "back") { ui.view = ui.from || "today"; render(); }
  else if (a === "mugs") { ui.mugs = Math.min(8, Math.max(1, ui.mugs + (+v))); var y2 = window.scrollY; render(); window.scrollTo(0, y2); }
  else if (a === "subs") {
    var opts = subsFor(id).sort(function (x, y) { return y.ok - x.ok; });
    openSheet("Swaps for " + labelFor(id).toLowerCase(), has(id) ? "You have this, but here's what works if you run out." : "Ways to make this recipe without it.", opts);
  }
  else if (a === "basesubs") {
    var r = R[ui.recipe], type = r.base[0], B = BASES[type];
    var list = B.direct.concat(B.alt).map(function (mth) {
      return { ok: hasEquip(mth), missing: [], how: "<strong>" + EQ[mth].label + ":</strong> " + baseStep(type, mth, r.base[1] * ui.mugs), m: mth };
    }).sort(function (x, y) { return y.ok - x.ok; });
    list.forEach(function (o) { if (!o.ok) o.missing = ["__" + o.m]; });
    openSheet("Ways to make the " + B.label.toLowerCase(), "Every method that works for this recipe, starting with gear you have.", list);
  }
  else if (a === "filter") { ui.filter = v; render(); }
  else if (a === "units") { profile.units = v; persist(); render(); }
  else if (a === "retake") { ui.view = "survey"; ui.step = 0; render(); }
  else if (a === "reset") { ui.confirmReset = true; render(); }
  else if (a === "cancelreset") { ui.confirmReset = false; render(); }
  else if (a === "doreset") { profile = blankProfile(); ui.confirmReset = false; persist(); ui.view = "welcome"; render(); }
  else if (a === "go") { ui.view = v; render(); }
});
// labels for gear in the "needs" line
var _labelFor = labelFor;
labelFor = function (id) { return id.indexOf("__") === 0 ? (EQ[id.slice(2)] ? EQ[id.slice(2)].label : id) : _labelFor(id); };

function renderKeep() { var y = window.scrollY; render(); window.scrollTo(0, y); }
function setDraftField(el) {
  var f = el.dataset.f; if (!f || !ui.draft) return false;
  var val = el.type === "checkbox" ? el.checked : el.value, parts = f.split(".");
  if (parts[0] === "ing") ui.draft.ing[+parts[1]][parts[2]] = val; else ui.draft[f] = val;
  return true;
}
document.addEventListener("input", function (e) {
  if (e.target.id === "search") { ui.q = e.target.value; renderLibList(); return; }
  if (e.target.id === "rcode") {
    ui.restoreText = e.target.value; ui.pending = parseBackup(e.target.value);
    ui.restoreErr = ui.pending || !e.target.value.trim() ? "" : "That doesn't look like a Daily Brew backup yet. Make sure you pasted the whole code.";
    var pvEl = document.getElementById("rpreview"), btn = document.querySelector("[data-act=dorestore]");
    if (pvEl) { var tmp = document.createElement("div"); tmp.innerHTML = vRestore(); var np = tmp.querySelector("#rpreview"); pvEl.innerHTML = np ? np.innerHTML : ""; }
    if (btn) btn.disabled = !ui.pending;
    return;
  }
  setDraftField(e.target);
});
document.addEventListener("change", function (e) {
  if (e.target.id === "rfile" && e.target.files && e.target.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { checkRestore(String(fr.result || "")); };
    fr.onerror = function () { ui.restoreErr = "Couldn't read that file. Try the backup code instead."; renderKeep(); };
    fr.readAsText(e.target.files[0]);
    return;
  }
  if (!setDraftField(e.target)) return;
  var f = e.target.dataset.f;
  if (f === "baseType") {
    var d = ui.draft; d.baseAmt = d.baseType === "esp" ? 2 : d.baseType === "inst" ? 2 : baseToInput(d.baseType, 240);
    renderKeep();
  } else if (/^ing\.\d+\.id$/.test(f)) {
    renderKeep();
    if (e.target.value === "x:") { var tx = document.getElementById("ingt-" + f.split(".")[1]); if (tx) tx.focus(); }
  }
});

render();

/* ---------- Account sync ---------- */
(async function () {
  if (!window.claude || typeof window.claude.use !== "function") return;
  var timer = setTimeout(function () { timer = null; }, 10000);
  try {
    var res = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    var db = res[0], user = res[1];
    if (!db || !user || !timer) return;
    var id = await user.id();
    var ref = db.collection("data/users/" + id).doc("profile");
    var snap = await ref.get();
    clearTimeout(timer);
    var data = snap && typeof snap.data === "function" ? snap.data() : snap;
    if (snap && snap.exists === false) data = null;
    cloud.ref = ref; cloud.status = "cloud";
    if (data && data.survey && (data.updatedAt || 0) > (profile.updatedAt || 0)) {
      var inOnboarding = ui.view === "survey" || ui.view === "setup";
      profile = Object.assign(blankProfile(), data);
      try { localStorage.setItem("daily-brew", JSON.stringify(profile)); } catch (e) {}
      if (profile.done && (ui.view === "welcome" || inOnboarding)) ui.view = "today";
      render();
    } else if (profile.updatedAt) {
      persist();
      render();
    } else {
      var n = app.querySelector(".save-note"); if (n && ui.view === "profile") n.textContent = saveNote();
    }
  } catch (e) { if (timer) clearTimeout(timer); }
})();
})();
</script>

<script>
/* Offline support: works once the app is served over http(s), not from a double-clicked file. */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
